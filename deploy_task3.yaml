apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: busybox
        image: busybox:latest
        command: ["sh", "-c", "while true; do echo $(date) >> /input/date.txt; sleep 5; done"]
        volumeMounts:
        - name: vol
          mountPath: /input
      - name: multitool
        image: wbitt/network-multitool
        command: ["/bin/sh", "-c", "tail -f /input/date.txt"]
        volumeMounts:
        - name: vol
          mountPath: /input
        ports:
          - containerPort: 80
      volumes:
      - name: vol
        persistentVolumeClaim:
          claimName: p-vol1